services:
  - type: web
    name: battlecode-platform
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: battlecode-postgres
          property: connectionString

databases:
  - name: battlecode-postgres
    plan: free
    region: singapore
    databaseName: battlecode_db
    user: battlecode_user
